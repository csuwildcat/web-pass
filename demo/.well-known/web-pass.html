<!doctype html>
<html lang="en" class="wa-dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Pass Connect</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

      :root {
        color-scheme: dark;
        font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
        --demo-bg: #0a0f1a;
        --demo-panel: rgba(15, 19, 30, 0.88);
        --demo-panel-soft: rgba(15, 19, 30, 0.68);
        --demo-border: rgba(148, 163, 184, 0.18);
        --demo-light: #f7f6f2;
        --demo-light-muted: #9ca3af;
        --demo-accent: #5eead4;
        --demo-accent-strong: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--demo-bg);
        color: var(--demo-light);
      }

      body {
        position: relative;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 12% 18%, rgba(59, 130, 246, 0.22), transparent 48%),
          radial-gradient(circle at 80% 12%, rgba(16, 185, 129, 0.18), transparent 40%),
          radial-gradient(circle at 70% 85%, rgba(236, 72, 153, 0.16), transparent 45%);
        pointer-events: none;
        z-index: 0;
      }

      main.connect-shell {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 1rem;
        width: min(440px, 100%);
        margin: 0 auto;
        padding: 1rem;
      }

      .connect-chrome {
        display: grid;
        gap: 0.75rem;
        padding-top: 0.25rem;
      }

      .connect-brand {
        display: flex;
        align-items: center;
        gap: 0.85rem;
      }

      .connect-logo {
        width: 2.6rem;
        height: 2.6rem;
        opacity: 0.92;
      }

      .connect-eyebrow {
        margin: 0;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(247, 246, 242, 0.68);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.85rem, 8vw, 2.35rem);
        letter-spacing: -0.03em;
      }

      .note {
        margin: 0;
        font-size: 0.95rem;
        color: var(--demo-light-muted);
        line-height: 1.5;
      }

      web-pass-form {
        display: block;
        min-height: 0;
      }

      web-pass-form .web-pass-consent {
        min-height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 1.25rem;
      }

      web-pass-form .web-pass-consent__hero {
        display: grid;
        gap: 0.5rem;
        padding: 0.15rem 0 0;
      }

      web-pass-form .web-pass-consent__prompt {
        margin: 0;
        color: var(--demo-light);
        font-size: 1.08rem;
        line-height: 1.45;
      }

      web-pass-form .web-pass-consent__body {
        min-height: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 0.85rem;
      }

      web-pass-form label {
        display: grid;
        gap: 0;
      }

      web-pass-form .web-pass-visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      web-pass-form .web-pass-consent__instruction {
        margin: 0;
        max-width: 22rem;
        font-size: 0.92rem;
        color: var(--demo-light-muted);
        line-height: 1.5;
        text-align: center;
      }

      web-pass-form .web-pass-consent__field {
        width: min(100%, 21rem);
      }

      web-pass-form input {
        font: inherit;
        width: 100%;
        min-height: 3.5rem;
        padding: 0 1.2rem;
        border-radius: 999px;
        border: 1px solid rgba(94, 234, 212, 0.34);
        background:
          linear-gradient(180deg, rgba(17, 24, 39, 0.92), rgba(7, 12, 24, 0.96));
        color: var(--demo-light);
        box-shadow:
          0 14px 26px rgba(2, 6, 23, 0.42),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        transition:
          border-color 150ms ease,
          background-color 150ms ease,
          box-shadow 150ms ease,
          transform 150ms ease;
      }

      web-pass-form .web-pass-consent__username {
        color: var(--demo-light);
        cursor: pointer;
        font-weight: 650;
        text-align: center;
      }

      web-pass-form .web-pass-consent__field:hover .web-pass-consent__username {
        border-color: rgba(94, 234, 212, 0.48);
        background:
          linear-gradient(180deg, rgba(24, 33, 52, 0.96), rgba(10, 16, 30, 0.98));
        box-shadow:
          0 18px 30px rgba(2, 6, 23, 0.48),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        transform: translateY(-1px);
      }

      web-pass-form input::placeholder {
        color: rgba(226, 232, 240, 0.76);
      }

      web-pass-form input:focus {
        outline: none;
      }

      web-pass-form input:focus-visible {
        border-color: rgba(94, 234, 212, 0.55);
        box-shadow:
          0 0 0 3px rgba(56, 189, 248, 0.18),
          0 18px 30px rgba(2, 6, 23, 0.48);
      }

      web-pass-form .web-pass-consent__selected {
        width: min(100%, 21rem);
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.9rem;
        margin-top: 1.5rem;
        padding: 0.8rem 0.9rem 0.8rem 1rem;
        border-radius: 10px;
        border: 1px solid rgba(74, 222, 128, 0.5);
        background:
          linear-gradient(180deg, rgba(20, 44, 33, 0.94), rgba(12, 29, 23, 0.98));
        box-shadow:
          0 16px 28px rgba(2, 6, 23, 0.34),
          inset 0 1px 0 rgba(187, 247, 208, 0.08);
      }

      web-pass-form .web-pass-consent__selected[hidden] {
        display: grid;
        visibility: hidden;
        pointer-events: none;
      }

      web-pass-form .web-pass-consent__selected-copy {
        min-width: 0;
        display: grid;
        gap: 0.2rem;
      }

      web-pass-form .web-pass-consent__selected-label,
      web-pass-form .web-pass-consent__selected-name {
        margin: 0;
      }

      web-pass-form .web-pass-consent__selected-label {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(187, 247, 208, 0.72);
      }

      web-pass-form .web-pass-consent__selected-name {
        min-width: 0;
        font-size: 1rem;
        font-weight: 650;
        color: #ecfdf5;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      web-pass-form .web-pass-consent__clear {
        min-height: 2.4rem;
        min-width: 2.4rem;
        padding: 0;
        border-radius: 999px;
        border-color: rgba(187, 247, 208, 0.24);
        background: rgba(6, 18, 15, 0.42);
        color: #d1fae5;
        box-shadow: none;
      }

      web-pass-form .web-pass-consent__clear:not(:disabled):hover {
        background: rgba(6, 18, 15, 0.68);
        border-color: rgba(187, 247, 208, 0.42);
        transform: none;
      }

      web-pass-form .web-pass-consent__actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 0.75rem;
        margin-top: auto;
        padding-top: 1.1rem;
      }

      web-pass-form button {
        font: inherit;
        min-height: 3.2rem;
        padding: 0 1rem;
        border-radius: 18px;
        border: 1px solid transparent;
        font-weight: 650;
        cursor: pointer;
        transition:
          transform 150ms ease,
          border-color 150ms ease,
          background-color 150ms ease,
          box-shadow 150ms ease,
          opacity 150ms ease;
      }

      web-pass-form button:focus {
        outline: none;
      }

      web-pass-form button:focus-visible {
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22);
      }

      web-pass-form button.primary {
        background: linear-gradient(135deg, var(--demo-accent), var(--demo-accent-strong));
        color: #06121f;
        box-shadow: 0 14px 24px rgba(14, 165, 233, 0.24);
      }

      web-pass-form button.secondary {
        background: rgba(15, 19, 30, 0.68);
        color: var(--demo-light);
        border-color: rgba(148, 163, 184, 0.26);
      }

      web-pass-form button:not(:disabled):hover {
        transform: translateY(-1px);
      }

      web-pass-form button.primary:not(:disabled):hover {
        box-shadow: 0 18px 28px rgba(14, 165, 233, 0.32);
      }

      web-pass-form button.secondary:not(:disabled):hover {
        background: rgba(30, 41, 59, 0.88);
      }

      web-pass-form button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        box-shadow: none;
      }

      .is-hidden {
        display: none !important;
      }

      @media (max-width: 480px) {
        main.connect-shell {
          padding: 0.85rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="connect-shell">
      <header class="connect-chrome">
        <div class="connect-brand">
          <img class="connect-logo" src="../logo.svg" alt="Web Pass logo">
          <div>
            <p class="connect-eyebrow">Web Pass Connect</p>
            <h1>Approve request</h1>
          </div>
        </div>
      </header>
      <web-pass-form id="web-pass-connect" flow="connect" auth-jwt="demo.jwt.token"></web-pass-form>
    </main>

    <script type="module">
      import '/wallet-main.js';
    </script>
  </body>
</html>
